<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice — KarkiVerse</title><link rel="stylesheet" href="style.css"><script defer src="shared.js"></script></head><body class="kv"><canvas class="topography"></canvas><div class="grain"></div><header class="kv-header"><div class="kv-bar"><a class="kv-logo" href="index.html">KarkiVerse.</a><nav class="kv-nav"><a href="index.html">Home</a><a href="about.html">My Life</a><a href="games.html">Games</a><a href="voices.html" aria-current="page">Voice</a><a href="https://karkiai.onrender.com/">KarkiAI</a></nav></div></header><main class="kv-wrap"><h1>Voice Zone</h1><p>Type something, pick a voice, and hear it spoken.</p><label for="say">Your text</label><textarea id="say" rows="7" style="width:100%;background:#111113;color:#f4f2ee;border:1px solid #232326;padding:16px" placeholder="Type what the voice should say"></textarea><label for="voice">Voice</label><select id="voice" style="width:100%;padding:14px;background:#111113;color:#f4f2ee;border:1px solid #232326"></select><p><button class="kv-btn" id="speak">Speak</button> <button class="kv-btn ghost" id="stop">Stop</button></p><p id="msg" role="status"></p></main><footer class="site-footer"><span>© 2026 KarkiVerse</span><span>Made by Sarwagya Karki</span></footer><script>const v=document.querySelector('#voice'),msg=document.querySelector('#msg');function load(){v.innerHTML='';speechSynthesis.getVoices().forEach((x,i)=>v.add(new Option(x.name+' ('+x.lang+')',i)))}load();speechSynthesis.onvoiceschanged=load;document.querySelector('#speak').onclick=()=>{const t=document.querySelector('#say').value.trim();if(!t){msg.textContent='Type something first.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t),vs=speechSynthesis.getVoices();if(vs[v.value])u.voice=vs[v.value];u.onend=()=>msg.textContent='';msg.textContent='Speaking…';speechSynthesis.speak(u)};document.querySelector('#stop').onclick=()=>{speechSynthesis.cancel();msg.textContent='Stopped.'}</script></body></html>
